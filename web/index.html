<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VidLingua · 课程译前工作台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">V</span><div><strong>VidLingua</strong><small>课程视频译前工作台</small></div></div><div class="topnote">本地处理 · 人声音轨转写</div></header>
  <main>
    <section class="hero"><div><div class="eyebrow">ENGLISH → 中文配音</div><h1>从视频到可翻译的英文句段</h1><p>导入课程视频，自动分离人声和背景音，再用人声识别英文。快速复核后导出带时间预算的译前数据。</p></div><div class="hero-shape"><span>01 导入</span><span>02 分离</span><span>03 转写</span><span>04 复核</span></div></section>
    <section class="layout"><aside class="sidebar"><div class="panel upload-panel"><div class="section-head"><h2>新建任务</h2><span>MP4</span></div><form id="upload-form"><label class="drop" id="drop"><input id="file" name="file" type="file" accept="video/mp4,.mp4" required><span class="upload-icon">↑</span><strong id="file-label">选择或拖入课程视频</strong><small>视频仅保存在本机工作目录</small></label><label>课程名称<input name="title" placeholder="例如：计算机视觉入门"></label><label>学科 / 背景<input name="subject" placeholder="帮助后续翻译理解上下文"></label><label>术语表 <em>每行一条</em><textarea name="glossary" rows="3" placeholder="neural network = 神经网络"></textarea></label><button class="primary full" type="submit" id="create-btn">导入并开始处理 <span>→</span></button></form></div><div class="panel jobs-panel"><div class="section-head"><h2>任务列表</h2><span id="job-total">0 项</span></div><div id="job-list" class="job-list"></div></div><div class="panel upload-panel"><div class="section-head"><h2>DeepSeek 配置</h2><span id="deepseek-state">未配置</span></div><form id="deepseek-form"><label>API Key<input id="deepseek-key" type="password" autocomplete="new-password" placeholder="留空则保持现有密钥"></label><small class="setting-hint">密钥保存在本机 Windows 凭据管理器，不回传到页面。</small><label>模型<select id="deepseek-model"><option value="deepseek-flash">deepseek-flash</option><option value="deepseek-v4-pro">deepseek-v4-pro</option></select></label><label>温度<input id="deepseek-temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label><label>最大输出 Token<input id="deepseek-max-tokens" type="number" min="512" max="8192" step="1" value="4096"></label><div class="setting-actions"><button type="submit" class="primary">保存配置</button><button type="button" class="ghost" id="deepseek-test">测试连接</button></div><button type="button" class="link-button" id="deepseek-remove">移除已保存密钥</button><small class="setting-hint">测试连接会向 DeepSeek 发送一个极短请求。翻译任务会发送英文句段、背景和术语表。</small></form></div></aside>
    <div class="workspace" id="workspace"><div class="empty panel"><div class="empty-icon">▶</div><h2>开始一个课程任务</h2><p>上传视频后，这里会显示处理进度、画面预览和可编辑的英文句段。</p></div></div></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
